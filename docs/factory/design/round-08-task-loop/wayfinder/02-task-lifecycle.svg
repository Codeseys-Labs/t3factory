<g id="capture"><title>Capture → local task</title><rect x="350" y="170" width="300" height="100" rx="9" fill="#191d24" stroke="#66778e"/>
<text x="366" y="191" font-size="11" font-weight="600" class="muted">P1 PROPOSAL</text>
<text x="366" y="214" font-size="18" font-weight="600">Capture → local task</text>
<text x="366" y="236" font-size="14" class="muted">One task; optional source context</text>
<text x="366" y="255" font-size="14" class="muted">Save for later or analyze now</text>
</g>
<g id="analyze"><title>Analyze the outcome</title><rect x="350" y="310" width="300" height="110" rx="9" fill="#191d24" stroke="#66778e"/>
<text x="366" y="331" font-size="11" font-weight="600" class="muted">P1 PROPOSAL</text>
<text x="366" y="354" font-size="18" font-weight="600">Analyze the outcome</text>
<text x="366" y="376" font-size="14" class="muted">Find criteria and constraints</text>
<text x="366" y="395" font-size="14" class="muted">Request blocking missing context</text>
<text x="366" y="414" font-size="14" class="muted">Choose the smallest useful plan</text>
</g>
<g id="plan"><title>Plan and child tasks</title><rect x="50" y="480" width="350" height="110" rx="9" fill="#191d24" stroke="#66778e"/>
<text x="66" y="501" font-size="11" font-weight="600" class="muted">P1 PROPOSAL</text>
<text x="66" y="524" font-size="18" font-weight="600">Plan and child tasks</text>
<text x="66" y="546" font-size="14" class="muted">Dependencies decide readiness</text>
<text x="66" y="565" font-size="14" class="muted">Child purpose, criteria and output</text>
<text x="66" y="584" font-size="14" class="muted">Progress stays within granted scope</text>
</g>
<g id="direct"><title>Simple task: act directly</title><rect x="650" y="480" width="300" height="110" rx="9" fill="#191d24" stroke="#66778e"/>
<text x="666" y="501" font-size="11" font-weight="600" class="muted">P1 PROPOSAL</text>
<text x="666" y="524" font-size="18" font-weight="600">Simple task: act directly</text>
<text x="666" y="546" font-size="14" class="muted">Same task and evidence</text>
<text x="666" y="565" font-size="14" class="muted">No decomposition or setup required</text>
<text x="666" y="584" font-size="14" class="muted">Example: summarize a supplied note</text>
</g>
<g id="routing"><title>Admit a ready child</title><rect x="50" y="670" width="350" height="110" rx="9" fill="#191d24" stroke="#66778e"/>
<text x="66" y="691" font-size="11" font-weight="600" class="muted">P1 PROPOSAL</text>
<text x="66" y="714" font-size="18" font-weight="600">Admit a ready child</text>
<text x="66" y="736" font-size="14" class="muted">Auto: model + harness + machine</text>
<text x="66" y="755" font-size="14" class="muted">Check capability, access and capacity</text>
<text x="66" y="774" font-size="14" class="muted">Show the admitted assignment</text>
</g>
<g id="control"><title>Hold, stop or recover</title><rect x="650" y="670" width="300" height="150" rx="9" fill="#191d24" stroke="#66778e"/>
<text x="666" y="691" font-size="11" font-weight="600" class="muted">P1 PROPOSAL</text>
<text x="666" y="714" font-size="18" font-weight="600">Hold, stop or recover</text>
<text x="666" y="736" font-size="14" class="muted">Retain the task when blocked</text>
<text x="666" y="755" font-size="14" class="muted">Pause future starts; show active work</text>
<text x="666" y="774" font-size="14" class="muted">Stop requested is not stopped</text>
<text x="666" y="793" font-size="14" class="muted">Wait for acknowledgement or fencing</text>
<text x="666" y="812" font-size="14" class="muted">Unknown result: reconcile before retry</text>
</g>
<g id="attempt"><title>Execute an owned attempt</title><rect x="50" y="860" width="350" height="110" rx="9" fill="#191d24" stroke="#66778e"/>
<text x="66" y="881" font-size="11" font-weight="600" class="muted">P1 PROPOSAL</text>
<text x="66" y="904" font-size="18" font-weight="600">Execute an owned attempt</text>
<text x="66" y="926" font-size="14" class="muted">Lineage records what actually ran</text>
<text x="66" y="945" font-size="14" class="muted">Late results cannot replace newer work</text>
<text x="66" y="964" font-size="14" class="muted">Return evidence and uncertainty</text>
</g>
<g id="evidence"><title>Assemble the results</title><rect x="650" y="860" width="300" height="110" rx="9" fill="#191d24" stroke="#66778e"/>
<text x="666" y="881" font-size="11" font-weight="600" class="muted">P1 PROPOSAL</text>
<text x="666" y="904" font-size="18" font-weight="600">Assemble the results</text>
<text x="666" y="926" font-size="14" class="muted">Reconcile results and disagreements</text>
<text x="666" y="945" font-size="14" class="muted">Preserve artifacts, sources and failures</text>
<text x="666" y="964" font-size="14" class="muted">Keep blocked work visible</text>
</g>
<g id="review"><title>Review the outcome</title><rect x="350" y="1070" width="300" height="110" rx="9" fill="#191d24" stroke="#66778e"/>
<text x="366" y="1091" font-size="11" font-weight="600" class="muted">P1 PROPOSAL</text>
<text x="366" y="1114" font-size="18" font-weight="600">Review the outcome</text>
<text x="366" y="1136" font-size="14" class="muted">Check criteria and evidence</text>
<text x="366" y="1155" font-size="14" class="muted">Inspect proposed external actions</text>
<text x="366" y="1174" font-size="14" class="muted">Revise the plan when needed</text>
</g>
<g id="outcome"><title>Record the outcome</title><rect x="350" y="1260" width="300" height="110" rx="9" fill="#191d24" stroke="#66778e"/>
<text x="366" y="1281" font-size="11" font-weight="600" class="muted">P1 CORE · P2 ACTION ADAPTERS</text>
<text x="366" y="1304" font-size="18" font-weight="600">Record the outcome</text>
<text x="366" y="1326" font-size="14" class="muted">Act within authorized scope</text>
<text x="366" y="1345" font-size="14" class="muted">Observe send/event/delivery receipts</text>
<text x="366" y="1364" font-size="14" class="muted">Accept or settle with explicit meaning</text>
</g>
<g id="reuse"><title>Save as workflow</title><rect x="730" y="1260" width="220" height="110" rx="9" fill="#191d24" stroke="#66778e"/>
<text x="746" y="1281" font-size="11" font-weight="600" class="muted">P3 · OPTIONAL P4 CI</text>
<text x="746" y="1304" font-size="18" font-weight="600">Save as workflow</text>
<text x="746" y="1326" font-size="14" class="muted">Version inputs and policy</text>
<text x="746" y="1345" font-size="14" class="muted">New run uses the same loop</text>
<text x="746" y="1364" font-size="14" class="muted">Eligible machine or CI target</text>
</g>
<text x="50" y="1411" font-size="13" class="muted">Coordinator owns task, plan and dispatch; executor owns processes, workspace and observed evidence.</text>
<text x="50" y="1445" font-size="13" class="muted">Completion, acceptance, delivery and settlement remain separate. This is proposed behavior, not runtime proof.</text>
</svg>
