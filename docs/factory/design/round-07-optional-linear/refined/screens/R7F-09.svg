ze="12" font-weight="400" fill="#8b97a9">PROPOSED DESIGN · Fictional fixtures · Inputs and external actions are static · No runtime or integration proof</text></g><g id="R7F-09--work-context"><text x="340" y="132" font-family="Inter" font-size="14" font-weight="600" fill="#f5f5f5">Factory · Workstation</text><text x="340" y="153" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">All planned · ENG-237 selected</text><text x="1580" y="153" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3" text-anchor="end">7 items</text></g><g id="R7F-09--recovery-back"><rect x="340" y="176" width="130" height="32" rx="6" fill="#161616" stroke="#383838" /><text x="352" y="197" font-family="Inter" font-size="13" font-weight="500" fill="#fff">← Back to Work</text></g><text x="340" y="263" font-family="Inter" font-size="13" font-weight="600" fill="#a8c4ff">Linear · ENG-237</text><g id="R7F-09--recovery-title"><text x="340" y="303" font-family="Inter" font-size="22" font-weight="600" fill="#f5f5f5">Keep the search index responsive in large</text><text x="340" y="332" font-family="Inter" font-size="22" font-weight="600" fill="#f5f5f5">repositories</text></g><text x="340" y="408" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Local Planning stage</text><g id="R7F-09--recovery-local-stage"><rect x="340" y="428" width="208" height="32" rx="6" fill="#161616" stroke="#383838" /><text x="352" y="449" font-family="Inter" font-size="13" font-weight="500" fill="#fff">Ready</text></g><text x="340" y="509" font-family="Inter" font-size="14" font-weight="600" fill="#f5f5f5">Saved details</text><g id="R7F-09--recovery-description"><text x="340" y="546" font-family="Inter" font-size="14" font-weight="400" fill="#f5f5f5">Keep typing responsive while the repository index refreshes.</text><text x="340" y="567" font-family="Inter" font-size="14" font-weight="400" fill="#f5f5f5">Preserve cancellation and report progress.</text></g><text x="340" y="668"