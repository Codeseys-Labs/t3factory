<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1230" viewBox="0 0 1000 1230" role="img" aria-labelledby="R8-WF01-title R8-WF01-desc">
<title id="R8-WF01-title">Where do I go to move this task forward?</title>
<desc id="R8-WF01-desc">A proposed task-centered navigation map. Capture and Intake lead to the same local task. Conversation, child work, evidence and attention retain that task context. Connections, workflows and machines remain optional secondary surfaces. Proposed Round-08 product navigation and lifecycle, using November 4 priority IDs P1-P4. These views complement canonical Wayfinder issue #2 and delivery roadmap #66; they do not renumber tracker milestones M0-M5 or slices W1-W5. Existing foundations are explicitly labeled; no runtime qualification is implied.</desc>
<style>text{font-family:Arial;fill:#f1f3f7}.muted{fill:#bac4d2}</style>
<rect width="1000" height="1230" fill="#101216"/>
<text x="50" y="44" font-size="26" font-weight="600">Where do I go to move this task forward?</text>
<text x="50" y="72" font-size="14" class="muted">T3 Factory · November 4 proposed priorities P1–P4 · complements tracker #2 / #66</text>
