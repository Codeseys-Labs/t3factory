th="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M1560.0,32.2 L1560,35" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M1554.8,27.0 L1552,27" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M1565.2,27.0 L1568,27" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><g id="R8-T03--nav-work"><rect x="340" y="58" width="72" height="30" rx="6" fill="#191a1d" stroke="none" /><text x="352" y="78" font-family="Inter" font-size="13" font-weight="500" fill="#f5f5f5">Work</text></g><g id="R8-T03--nav-intake"><rect x="416" y="58" width="76" height="30" rx="6" fill="#000" stroke="none" /><text x="428" y="78" font-family="Inter" font-size="13" font-weight="500" fill="#a3a3a3">Intake</text></g><g id="R8-T03--nav-workflows"><rect x="496" y="58" width="110" height="30" rx="6" fill="#000" stroke="none" /><text x="508" y="78" font-family="Inter" font-size="13" font-weight="500" fill="#a3a3a3">Workflows</text></g><g id="R8-T03--nav-more"><rect x="610" y="58" width="70" height="30" rx="6" fill="#000" stroke="none" /><text x="622" y="78" font-family="Inter" font-size="13" font-weight="500" fill="#a3a3a3">More</text></g><rect x="340" y="99" width="1240" height="1" rx="0" fill="#202020" stroke="none" /><g id="R8-T03--specification-outside-product"><rect x="0" y="900" width="1600" height="140" rx="0" fill="#10141c" stroke="#283244" /><text x="24" y="932" font-family="Inter" font-size="17" font-weight="600" fill="#f5f5f5">R8-T03 · Analysis · a focused question</text><text x="24" y="958" font-family="Inter" font-size="13" font-weight="400" fill="#b9c6cf">The task stays T-084. One missing fact pauses the dependent calendar work; the policy permits useful investigation and drafting within scope.</text><text x="24" y="1021" font-family="Inter" font-size="12" font-weight="400" fill="#8b97a9">PROPOSED DESIGN · Fictional task, assignments and receipts · No runtime, connector, native-import or accessibility proof</text></g><text x="340" y="133" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Customer operations  /  T-084</text><text x="340" y="165" font-family="Inter" font-size="22" font-weight="600" fill="#f5f5f5">Prepare the customer follow-up</text><text x="340" y="190" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Mara · Local task · Customer thread + incident note</text><rect x="340" y="214" width="1240" height="54" rx="8" fill="#10141c" stroke="#283244" /><circle cx="358" cy="241" r="4" fill="#346bf1" /><text x="374" y="239" font-family="Inter" font-size="14" font-weight="600" fill="#f5f5f5">Analyzing · one detail needed</text><text x="374" y="258" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Research and drafts are allowed · no email or calendar changes</text><rect x="340" y="294" width="90" height="28" rx="5" fill="#191a1d" stroke="none" /><text x="352" y="313" font-family="Inter" font-size="12" font-weight="500" fill="#f5f5f5">Investigate</text><rect x="434" y="294" width="90" height="28" rx="5" fill="#000" stroke="none" /><text x="446" y="313" font-family="Inter" font-size="12" font-weight="500" fill="#818181">Deep-dive</text><rect x="528" y="294" width="90" height="28" rx="5" fill="#000" stroke="none" /><text x="540" y="313" font-family="Inter" font-size="12" font-weight="500" fill="#818181">Architect</text><rect x="622" y="294" width="90" height="28" rx="5" fill="#000" stroke="none" /><text x="634" y="313" font-family="Inter" font-size="12" font-weight="500" fill="#818181">Plan</text><rect x="716" y="294" width="90" height="28" rx="5" fill="#000" stroke="none" /><text x="728" y="313" font-family="Inter" font-size="12" font-weight="500" fill="#818181">Act</text><rect x="810" y="294" width="90" height="28" rx="5" fill="#000" stroke="none" /><text x="822" y="313" font-family="Inter" font-size="12" font-weight="500" fill="#818181">Review</text><g id="R8-T03--analysis-message"><rect x="340" y="342" width="890" height="168" rx="8" fill="#0b0b0b" stroke="#262626" /></g><text x="360" y="372" font-family="Inter" font-size="13" font-weight="600" fill="#f5f5f5">Factory</text><g id="R8-T03--analysis-result"><text x="360" y="407" font-family="Inter" font-size="16" font-weight="400" fill="#f5f5f5">I found four useful pieces of work. The incident note and supplied email support the investigation; meeting</text><text x="360" y="432" font-family="Inter" font-size="16" font-weight="400" fill="#f5f5f5">options need the customer's time zone.</text></g><text x="360" y="487" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Research and the knowledge summary can proceed while this detail is clarified.</text><g id="R8-T03--context-question"><rect x="340" y="530" width="890" height="212" rx="8" fill="#0b0b0b" stroke="#262626" /></g><text x="360" y="562" font-family="Inter" font-size="16" font-weight="600" fill="#f5f5f5">Which time zone should I use?</text><g id="R8-T03--timezone-answer"><text x="360" y="588" font-family="Inter" font-size="12" font-weight="500" fill="#a3a3a3">Customer time zone</text><rect x="360" y="598" width="820" height="38" rx="6" fill="#0b0b0b" stroke="#383838" /><text x="372" y="622" font-family="Inter" font-size="14" font-weight="400" fill="#f5f5f5">America/Los_Angeles · supplied by Mara</text></g><g id="R8-T03--answer-context"><rect x="988" y="690" width="192" height="32" rx="6" fill="#346bf1" stroke="#346bf1" /><text x="1000" y="711" font-family="Inter" font-size="13" font-weight="500" fill="#fff">Use this and continue</text></g><g id="R8-T03--task-details"><rect x="1250" y="288" width="330" height="500" rx="8" fill="#0b0b0b" stroke="#262626" /></g><text x="1270" y="317" font-family="Inter" font-size="14" font-weight="600" fill="#f5f5f5">Task details</text><text x="1270" y="353" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Human owner</text><text x="1270" y="375" font-family="Inter" font-size="13" font-weight="400" fill="#f5f5f5">Mara</text><text x="1270" y="411" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Assignment</text><text x="1270" y="433" font-family="Inter" font-size="13" font-weight="400" fill="#f5f5f5">Auto · workspace policy</text><text x="1270" y="469" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Execution</text><text x="1270" y="491" font-family="Inter" font-size="13" font-weight="400" fill="#f5f5f5">Analyzing</text><text x="1270" y="527" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Source</text><text x="1270" y="549" font-family="Inter" font-size="13" font-weight="400" fill="#f5f5f5">Pasted context · local</text><text x="1270" y="585" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Outcome</text><text x="1270" y="607" font-family="Inter" font-size="13" font-weight="400" fill="#f5f5f5">Summary, meeting, reply</text><rect x="1270" y="630" width="290" height="1" rx="0" fill="#262626" stroke="none" /><g id="R8-T03--policy-summary"><text x="1270" y="659" font-family="Inter" font-size="13" font-weight="400" fill="#a3a3a3">Research and drafts may advance</text><text x="1270" y="679" font-family="Inter" font-size="13" font-weight="400" fill="#a3a3a3">automatically. Sending and calendar writes</text><text x="1270" y="699" font-family="Inter" font-size="13" font-weight="400" fill="#a3a3a3">need reviewed authority.</text></g><text x="1270" y="752" font-family="Inter" font-size="12" font-weight="400" fill="#818181">Connections are optional</text><text x="340" y="796" font-family="Inter" font-size="13" font-weight="400" fill="#a3a3a3">Original request and attachments stay available in the task history.</text></svg>