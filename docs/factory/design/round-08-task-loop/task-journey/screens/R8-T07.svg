ke-linecap="round" stroke-linejoin="round" /><path d="M1560.0,32.2 L1560,35" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M1554.8,27.0 L1552,27" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M1565.2,27.0 L1568,27" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><g id="R8-T07--nav-work"><rect x="340" y="58" width="72" height="30" rx="6" fill="#191a1d" stroke="none" /><text x="352" y="78" font-family="Inter" font-size="13" font-weight="500" fill="#f5f5f5">Work</text></g><g id="R8-T07--nav-intake"><rect x="416" y="58" width="76" height="30" rx="6" fill="#000" stroke="none" /><text x="428" y="78" font-family="Inter" font-size="13" font-weight="500" fill="#a3a3a3">Intake</text></g><g id="R8-T07--nav-workflows"><rect x="496" y="58" width="110" height="30" rx="6" fill="#000" stroke="none" /><text x="508" y="78" font-family="Inter" font-size="13" font-weight="500" fill="#a3a3a3">Workflows</text></g><g id="R8-T07--nav-more"><rect x="610" y="58" width="70" height="30" rx="6" fill="#000" stroke="none" /><text x="622" y="78" font-family="Inter" font-size="13" font-weight="500" fill="#a3a3a3">More</text></g><rect x="340" y="99" width="1240" height="1" rx="0" fill="#202020" stroke="none" /><g id="R8-T07--specification-outside-product"><rect x="0" y="900" width="1600" height="140" rx="0" fill="#10141c" stroke="#283244" /><text x="24" y="932" font-family="Inter" font-size="17" font-weight="600" fill="#f5f5f5">R8-T07 · Review the assembled outcome</text><text x="24" y="958" font-family="Inter" font-size="13" font-weight="400" fill="#b9c6cf">Preparation and observed worker completion precede this later review fixture. The optional external actions are reviewed here; no live connector or send is implemented.</text><text x="24" y="1021" font-family="Inter" font-size="12" font-weight="400" fill="#8b97a9">PROPOSED DESIGN · Fictional task, assignments and receipts · No runtime, connector, native-import or accessibility proof</text></g><text x="340" y="133" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Customer operations  /  T-084</text><text x="340" y="165" font-family="Inter" font-size="22" font-weight="600" fill="#f5f5f5">Prepare the customer follow-up</text><text x="340" y="190" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Mara · Local task · Customer thread + incident note</text><rect x="340" y="214" width="1240" height="54" rx="8" fill="#10141c" stroke="#283244" /><circle cx="358" cy="241" r="4" fill="#74c69d" /><text x="374" y="239" font-family="Inter" font-size="14" font-weight="600" fill="#f5f5f5">Ready to review · all 4 child results assembled</text><text x="374" y="258" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">One supported outcome · drafts are prepared · no external actions taken</text><g id="R8-T07--assembled-result"><rect x="340" y="288" width="720" height="276" rx="8" fill="#0b0b0b" stroke="#262626" /></g><text x="360" y="320" font-family="Inter" font-size="17" font-weight="600" fill="#f5f5f5">Customer follow-up</text><g id="R8-T07--result-summary"><text x="360" y="357" font-family="Inter" font-size="15" font-weight="400" fill="#f5f5f5">The refresh interruption matches the supplied incident note. The response explains the</text><text x="360" y="380" font-family="Inter" font-size="15" font-weight="400" fill="#f5f5f5">recovery step and links the evidence; the meeting proposal uses the confirmed time zone.</text></g><text x="360" y="460" font-family="Inter" font-size="13" font-weight="500" fill="#f5f5f5">Diagnosis.md</text><text x="1040" y="460" font-family="Inter" font-size="11" font-weight="400" fill="#a3a3a3" text-anchor="end">2 evidence links · assumption stated</text><text x="360" y="489" font-family="Inter" font-size="13" font-weight="500" fill="#f5f5f5">Customer brief.md</text><text x="1040" y="489" font-family="Inter" font-size="11" font-weight="400" fill="#a3a3a3" text-anchor="end">3 supplied sources · reviewed summary</text><text x="360" y="518" font-family="Inter" font-size="13" font-weight="500" fill="#f5f5f5">Reply.eml + Meeting proposal</text><text x="1040" y="518" font-family="Inter" font-size="11" font-weight="400" fill="#a3a3a3" text-anchor="end">Draft only · Thursday 12 Nov, 2:30 pm PST</text><g id="R8-T07--reply-preview"><rect x="340" y="584" width="720" height="178" rx="8" fill="#0b0b0b" stroke="#262626" /></g><text x="360" y="616" font-family="Inter" font-size="14" font-weight="600" fill="#f5f5f5">Reply preview</text><g id="R8-T07--reply-body"><text x="360" y="649" font-family="Inter" font-size="14" font-weight="400" fill="#f5f5f5">Hi Alex — the incident note says interrupted refreshes keep the last complete index. Please retry</text><text x="360" y="671" font-family="Inter" font-size="14" font-weight="400" fill="#f5f5f5">refresh and share the trace if it happens again.</text><text x="360" y="693" font-family="Inter" font-size="14" font-weight="400" fill="#f5f5f5">Would Thursday 12 Nov at 2:30 pm PST work for a 30-minute follow-up?</text><text x="360" y="715" font-family="Inter" font-size="14" font-weight="400" fill="#f5f5f5">Sources: Incident note.md §2; Customer email.eml.</text></g><g id="R8-T07--external-review"><rect x="1080" y="288" width="500" height="474" rx="8" fill="#0b0b0b" stroke="#262626" /></g><text x="1100" y="320" font-family="Inter" font-size="15" font-weight="600" fill="#f5f5f5">Optional actions · review before approval</text><text x="1100" y="360" font-family="Inter" font-size="14" font-weight="500" fill="#f5f5f5">☑  Email</text><text x="1100" y="389" font-family="Inter" font-size="13" font-weight="400" fill="#f5f5f5">To: alex@example.test</text><text x="1100" y="413" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Subject: Search refresh follow-up</text><text x="1100" y="476" font-family="Inter" font-size="14" font-weight="500" fill="#f5f5f5">☑  Calendar hold</text><text x="1100" y="505" font-family="Inter" font-size="13" font-weight="400" fill="#f5f5f5">Mara only · no customer invitation</text><text x="1100" y="529" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">12 Nov 2026 · 2:30–3:00 pm PST</text><rect x="1100" y="586" width="460" height="1" rx="0" fill="#262626" stroke="none" /><g id="R8-T07--approval-boundary"><text x="1100" y="616" font-family="Inter" font-size="13" font-weight="400" fill="#a3a3a3">Approve exactly this reply and this private hold. Any changed recipient,</text><text x="1100" y="637" font-family="Inter" font-size="13" font-weight="400" fill="#a3a3a3">content or time needs another review.</text></g><g id="R8-T07--accept-preparation"><rect x="340" y="812" width="226" height="32" rx="6" fill="#161616" stroke="#383838" /><text x="352" y="833" font-family="Inter" font-size="13" font-weight="500" fill="#fff">Accept preparation only</text></g><g id="R8-T07--approve-external"><rect x="1270" y="812" width="310" height="32" rx="6" fill="#346bf1" stroke="#346bf1" /><text x="1282" y="833" font-family="Inter" font-size="13" font-weight="500" fill="#fff">Accept + approve actions</text></g><text x="340" y="796" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Worker stop acknowledged · evidence retained · source content unchanged</text></svg>