ill="#8b97a9">PROPOSED / FICTIONAL · Editable source · No runtime, native, connector, mobile or accessibility proof</text></g><text x="340" y="133" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Customer operations  /  T-084</text><text x="340" y="165" font-family="Inter" font-size="22" font-weight="600" fill="#f5f5f5">Prepare the customer follow-up</text><text x="340" y="190" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Mara · Local task · Customer thread + incident note</text><rect x="340" y="214" width="1240" height="54" rx="8" fill="#10141c" stroke="#283244" /><circle cx="358" cy="241" r="4" fill="#e8bf78" /><text x="374" y="239" font-family="Inter" font-size="14" font-weight="600" fill="#f5f5f5">Reopened · no new work started</text><text x="374" y="258" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Previously accepted revision 1 is unchanged · describe follow-up work when needed</text><g id="R9-T04--follow-up-intent"><rect x="340" y="288" width="720" height="270" rx="8" fill="#0b0b0b" stroke="#262626" /></g><text x="360" y="323" font-family="Inter" font-size="17" font-weight="600" fill="#f5f5f5">What needs further work?</text><g id="R9-T04--intent-placeholder"><text x="360" y="365" font-family="Inter" font-size="17" font-weight="400" fill="#818181">Describe a follow-up request…</text></g><text x="360" y="421" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">No new work begins until you provide a follow-up request.</text><g id="R9-T04--scope-followup"><text x="360" y="464" font-family="Inter" font-size="14" font-weight="400" fill="#a3a3a3">A new request may continue research and drafts within the existing scope. Another send or calendar</text><text x="360" y="486" font-family="Inter" font-size="14" font-weight="400" fill="#a3a3a3">change needs a new reviewed approval.</text></g><g id="R9-T04--retained-result"><rect x="340" y="580" width="720" height="180" rx="8" fill="#0b0b0b" s