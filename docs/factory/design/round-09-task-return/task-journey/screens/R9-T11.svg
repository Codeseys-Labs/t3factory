eight="400" fill="#8b97a9">PROPOSED / FICTIONAL · Editable source · No runtime, native, connector, mobile or accessibility proof</text></g><text x="340" y="133" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">T-084  /  T-084.2  /  Completed child</text><text x="340" y="165" font-family="Inter" font-size="22" font-weight="600" fill="#f5f5f5">Customer knowledge brief</text><text x="340" y="190" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Read-only result · Original parent: completed T-084 with action receipts</text><rect x="340" y="214" width="1240" height="54" rx="8" fill="#10141c" stroke="#283244" /><circle cx="358" cy="241" r="4" fill="#74c69d" /><text x="374" y="239" font-family="Inter" font-size="14" font-weight="600" fill="#f5f5f5">T-084.2 complete · Customer brief.md</text><text x="374" y="258" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Knowledge agent result · read-only · parent acceptance remains separate</text><g id="R9-T11--full-child-output"><rect x="340" y="288" width="820" height="280" rx="8" fill="#0b0b0b" stroke="#262626" /></g><text x="360" y="323" font-family="Inter" font-size="17" font-weight="600" fill="#f5f5f5">Customer-ready knowledge brief · full output</text><g id="R9-T11--child-output"><text x="360" y="368" font-family="Inter" font-size="17" font-weight="400" fill="#f5f5f5">The supplied incident note says an interrupted refresh keeps the last complete index. Ask Alex</text><text x="360" y="395" font-family="Inter" font-size="17" font-weight="400" fill="#f5f5f5">to retry the refresh once, then share a trace if the interruption repeats. The customer email</text><text x="360" y="422" font-family="Inter" font-size="17" font-weight="400" fill="#f5f5f5">reports the interruption but does not establish its cause. A follow-up can check recovery; no</text><text x="360" y="449" font-family="Inter" font-size="17" font-weight="400" fill="#f5f5f5">customer invitation has been sent.</text></g><text x="360" y="539" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Customer brief.md · brief-084-2-r1</text><g id="R9-T11--child-sources"><rect x="340" y="588" width="820" height="192" rx="8" fill="#0b0b0b" stroke="#262626" /></g><text x="360" y="621" font-family="Inter" font-size="15" font-weight="600" fill="#f5f5f5">Sources and uncertainty</text><text x="360" y="659" font-family="Inter" font-size="13" font-weight="400" fill="#f5f5f5">Incident note.md §2 · Customer email.eml · Availability.txt</text><g id="R9-T11--child-uncertainty"><text x="360" y="699" font-family="Inter" font-size="14" font-weight="400" fill="#a3a3a3">Supplied sources only. The reported cause is unconfirmed; availability supports a proposal, not a booking or</text><text x="360" y="722" font-family="Inter" font-size="14" font-weight="400" fill="#a3a3a3">customer invitation.</text></g><g id="R9-T11--child-assignment"><rect x="1180" y="288" width="400" height="492" rx="8" fill="#0b0b0b" stroke="#262626" /></g><text x="1200" y="323" font-family="Inter" font-size="15" font-weight="600" fill="#f5f5f5">Recorded assignment</text><text x="1200" y="367" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Model</text><text x="1200" y="392" font-family="Inter" font-size="14" font-weight="400" fill="#f5f5f5">Sonnet 5.5</text><text x="1200" y="429" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Harness</text><text x="1200" y="454" font-family="Inter" font-size="14" font-weight="400" fill="#f5f5f5">Claude Code</text><text x="1200" y="491" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Environment</text><text x="1200" y="516" font-family="Inter" font-size="14" font-weight="400" fill="#f5f5f5">Workstation · env-demo</text><text x="1200" y="553" font-family="Inter" font-size="12" font-weight="400" fill="#a3a3a3">Attempt</text><text x="1200" y="578" font-family="Inter" font-size="14" font-weight="400" fill="#f5f5f5">attempt-084-2-1 · complete</text><rect x="1200" y="602" width="360" height="1" rx="0" fill="#262626" stroke="none" /><text x="1200" y="635" font-family="Inter" font-size="14" font-weight="600" fill="#f5f5f5">Dependency context</text><g id="R9-T11--child-dependencies"><text x="1200" y="672" font-family="Inter" font-size="14" font-weight="400" fill="#a3a3a3">Inputs: supplied context; no child prerequisite.</text><text x="1200" y="694" font-family="Inter" font-size="14" font-weight="400" fill="#a3a3a3">T-084.4 used this brief with .1 and .3. No child is</text><text x="1200" y="716" font-family="Inter" font-size="14" font-weight="400" fill="#a3a3a3">restarted by reading it.</text></g><g id="R9-T11--return-origin-parent"><rect x="340" y="812" width="328" height="32" rx="6" fill="#346bf1" stroke="#346bf1" /><text x="352" y="833" font-family="Inter" font-size="13" font-weight="500" fill="#fff">Return to completed T-084</text></g></svg>